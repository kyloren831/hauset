spring.application.name=api

# Base de datos PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app_domotica}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Almacenamiento en disco dedicado del propio servidor
hauset.storage.disk.base-path=${STORAGE_DISK_PATH:./storage_data}

# Seguridad. El secreto JWT (Base64, mínimo 32 bytes) NO tiene valor por defecto:
# sin APP_JWTSECRET la aplicación no arranca.
app.jwtSecret=${APP_JWTSECRET}
app.jwtExpirationMs=${APP_JWTEXPIRATIONMS:900000}
app.jwtRefreshExpirationMs=${APP_JWTREFRESHEXPIRATIONMS:604800000}
app.cors.allowedOrigins=${APP_CORS_ALLOWEDORIGINS:}
# Llave AES-256 (Base64, 32 bytes) de las contraseñas de los equipos (RF-MAN-04, RNF-SEG-05).
# Sin valor por defecto: sin HAUSET_CREDENCIALES_LLAVE la aplicación no arranca. No va en el respaldo de la base.
hauset.credenciales.llave=${HAUSET_CREDENCIALES_LLAVE}

# Detrás de nginx, la IP real viene en X-Forwarded-For
server.forward-headers-strategy=native
# Solo para desarrollo: restringir la interfaz de escucha (por ejemplo la IP de Tailscale)
server.address=${SERVER_ADDRESS:0.0.0.0}

# Solo se expone el estado de salud
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Archivos (fotos y PDF)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Datos de la empresa que salen en la cotización (PDF)
hauset.empresa.nombre-comercial=${EMPRESA_NOMBRE_COMERCIAL:HAUSET}
hauset.empresa.razon-social=${EMPRESA_RAZON_SOCIAL:R & A Soluciones Electromec\u00e1nicas S.A.}
hauset.empresa.cedula-juridica=${EMPRESA_CEDULA_JURIDICA:3-101-719758}
hauset.empresa.telefono=${EMPRESA_TELEFONO:+(506) 8727-7444}
hauset.empresa.correo=${EMPRESA_CORREO:hausetcr@gmail.com}
hauset.empresa.direccion=${EMPRESA_DIRECCION:250 m sur de la UNED, Palmares de Alajuela}
