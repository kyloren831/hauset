# Postgres de producción: solo escucha en la propia máquina; el backend corre en el host con systemd.
# Lo levanta instalar.sh:
#   sudo docker compose -f /opt/hauset/postgres.compose.yml --env-file /etc/hauset/postgres.env up -d --wait
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    # Sin root dentro del contenedor (999 = usuario postgres de la imagen, dueño del volumen).
    user: "999:999"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      - POSTGRES_DB=app_domotica
      - POSTGRES_USER=hauset
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en /etc/hauset/postgres.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Docker se salta UFW: publicar solo en 127.0.0.1.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hauset -d app_domotica"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
