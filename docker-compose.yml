# Claves en un .env (no versionado) junto a este archivo; ver .env.example.
services:
  backend:
    build: .
    restart: on-failure
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/app_domotica
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      - APP_JWTSECRET=${APP_JWTSECRET:?Define APP_JWTSECRET en .env}
      - HAUSET_CREDENCIALES_LLAVE=${HAUSET_CREDENCIALES_LLAVE:?Define HAUSET_CREDENCIALES_LLAVE en .env}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - STORAGE_DISK_PATH=/var/hauset/storage
    volumes:
      - hauset-storage-data:/var/hauset/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - domotica-net

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=app_domotica
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Solo en la máquina: el backend corre en el host o en esta red; nunca en la IP pública.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - domotica-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_domotica"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    networks:
      - domotica-net

volumes:
  postgres-data:
  hauset-storage-data:

networks:
  domotica-net:
