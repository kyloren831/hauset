services:
  backend:
    build: .
    restart: on-failure
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/app_domotica
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - STORAGE_DISK_PATH=/var/hauset/storage
    volumes:
      - hauset-storage-data:/var/hauset/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - domotica-net

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=app_domotica
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - domotica-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_domotica"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - domotica-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    networks:
      - domotica-net

volumes:
  postgres-data:
  minio-data:
  hauset-storage-data:

networks:
  domotica-net:
